<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPad 運営管理画面 | インタラクティブ・バルーンQ&A</title>
  <meta name="description" content="iPad専用 運営用管理パネル - 中央キャラクター切り替え＆吹き出し回答入力">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #CBD5E1;">
  <!-- ヘッダー -->
  <header class="app-header">
    <a href="index.html" class="brand-title" id="admin-brand-link">
      <span class="logo-icon">🎈</span>
      <span>バルーン Q&A <span style="font-size:0.85rem; color: var(--primary-color); font-weight:800;">[iPad 運営モード]</span></span>
    </a>
    
    <div style="display:flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <a href="index.html" class="admin-link">◀ 参加者画面</a>
      <button type="button" class="btn-filter" id="btn-refresh" style="background:#FFFFFF; font-weight:800;">🔄 更新</button>
      <button type="button" class="btn-filter" id="btn-open-config">API設定 ⚙️</button>
    </div>
  </header>

  <main class="container">
    
    <!-- ==========================================================================
         【上半分】中央1体 ＋ 左右見切れキャラクター ステージ (画像1デザイン)
         ========================================================================== -->
    <div class="ipad-stage-header">
      <!-- 左右矢印ボタン -->
      <button type="button" class="btn-stage-arrow left" id="btn-admin-prev" aria-label="前のキャラ">◀</button>
      <button type="button" class="btn-stage-arrow right" id="btn-admin-next" aria-label="次のキャラ">▶</button>

      <!-- 3体カルーセルスライダー -->
      <div class="carousel-characters-box">
        <!-- 左の見切れキャラ -->
        <div class="char-slot left-side" id="slot-left">
          <div class="char-slot-icon" id="slot-left-icon"></div>
          <div class="char-slot-name" id="slot-left-name"></div>
        </div>

        <!-- 中央の選択キャラ -->
        <div class="char-slot center" id="slot-center">
          <div class="char-slot-icon" id="slot-center-icon"></div>
          <div class="char-slot-name" id="slot-center-name">名前</div>
        </div>

        <!-- 右の見切れキャラ -->
        <div class="char-slot right-side" id="slot-right">
          <div class="char-slot-icon" id="slot-right-icon"></div>
          <div class="char-slot-name" id="slot-right-name"></div>
        </div>
      </div>
    </div>

    <!-- ==========================================================================
         【下半分】吹き出し型 回答入力エリア (画像1デザイン)
         ========================================================================== -->
    <div class="speech-bubble-wrapper">
      <!-- 吹き出しの上向き三角 -->
      <div class="speech-bubble-tail"></div>

      <!-- 吹き出し本体カード -->
      <div class="speech-bubble-card">
        
        <div class="bubble-header">
          <h3 id="bubble-char-title">クマさん 宛ての質問一覧</h3>
          <div class="filter-group">
            <button type="button" class="btn-filter active" data-admin-filter="all" id="filter-all">すべて</button>
            <button type="button" class="btn-filter" data-admin-filter="pending" id="filter-pending">未回答</button>
            <button type="button" class="btn-filter" data-admin-filter="answered" id="filter-answered">回答済み</button>
          </div>
        </div>

        <!-- 質問＆回答入力リスト -->
        <div class="admin-question-list" id="admin-question-list">
          <!-- JSで質問カード＆回答textareaが生成されます -->
        </div>

      </div>
    </div>

  </main>

  <!-- GAS設定モーダル -->
  <div class="modal-backdrop" id="config-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Google Apps Script (GAS) 設定</h3>
        <button type="button" class="modal-close" id="btn-close-config">&times;</button>
      </div>
      <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 14px;">
        Googleスプレッドシートと連携するGAS Web App URLです。
      </p>

      <div class="form-group">
        <label for="gas-url-input" class="form-label">GAS Web App URL</label>
        <input type="url" id="gas-url-input" class="question-textarea" style="min-height:48px; height:48px;" placeholder="https://script.google.com/macros/s/.../exec">
      </div>

      <div style="display:flex; justify-content:space-between; gap: 10px; margin-top: 20px;">
        <button type="button" class="btn-filter" id="btn-reset-mock" style="color: #E03131;">モックデータ初期化</button>
        <button type="button" class="btn-submit" id="btn-save-config" style="width:auto; padding: 8px 20px;">設定を保存</button>
      </div>
    </div>
  </div>

  <script src="js/characters.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
