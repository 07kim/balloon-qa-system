<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>インタラクティブ・バルーン Q&A システム</title>
  <meta name="description" content="参加者がキャラクターを選択して質問を風船として飛ばし、みんなでタップして成長・裏返して回答を見る体験型Q&Aプラットフォーム">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- アプリヘッダー -->
  <header class="app-header">
    <a href="#" class="brand-title" id="app-brand-title">
      <span class="logo-icon">🎈</span>
      <span>バルーン Q&A</span>
    </a>
    
    <nav class="tab-nav" aria-label="メインナビゲーション">
      <button type="button" class="tab-btn active" data-tab="submit" id="btn-tab-submit">
        <span>✏️ 質問を送る</span>
      </button>
      <button type="button" class="tab-btn" data-tab="balloons" id="btn-tab-balloons">
        <span>🎈 風船を見る</span>
      </button>
    </nav>

    <a href="admin.html" class="admin-link" id="link-to-admin">iPad 運営管理 ⚙️</a>
  </header>

  <!-- メインコンテンツ -->
  <main class="container">
    
    <!-- タブ1: 質問送信画面 -->
    <section id="tab-submit" class="tab-content active">
      <div class="submit-card">
        <div class="section-heading">
          <h2>質問を風船にして飛ばそう！</h2>
          <p>お好きなキャラクターを選んで質問を入力してください。</p>
        </div>

        <div class="form-group">
          <label class="form-label" id="label-char-select">
            1. キャラクターを選択する <span class="required-badge">必須</span>
          </label>
          <div class="character-grid" id="character-grid" aria-labelledby="label-char-select">
            <!-- JSで10種類のキャラクターが挿入されます -->
          </div>
        </div>

        <div class="form-group">
          <label for="question-input" class="form-label">
            2. 質問テキストを入力する <span class="required-badge">必須</span>
          </label>
          <textarea 
            id="question-input" 
            class="question-textarea" 
            placeholder="例: 今日の一番のおすすめセッションは何ですか？" 
            maxlength="200"
            rows="3"></textarea>
        </div>

        <button type="button" class="btn-submit" id="submit-btn">
          <span>風船を飛ばす 🎈</span>
        </button>

        <div id="form-alert" class="alert-message" role="alert"></div>
      </div>
    </section>

    <!-- タブ2: バルーン表示画面 (中央キャラ＋放射状浮遊風船) -->
    <section id="tab-balloons" class="tab-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px; flex-wrap:wrap; gap:10px;">
        <div class="filter-group">
          <button type="button" class="btn-filter active" data-balloon-filter="all" id="btn-balloon-filter-all">🌈 すべて</button>
          <button type="button" class="btn-filter" data-balloon-filter="pending" id="btn-balloon-filter-pending">❓ 質問 (未回答)</button>
          <button type="button" class="btn-filter" data-balloon-filter="answered" id="btn-balloon-filter-answered">💡 回答を見る</button>
        </div>

        <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 700;">
          同期中 (<span id="last-sync-time">--:--:--</span>) | 💡 風船をタップして回答を表示
        </div>
      </div>

      <!-- 放射状バルーンステージ -->
      <div class="radial-balloon-stage" id="balloon-stage">
        
        <!-- 左右切り替えボタン -->
        <button type="button" class="btn-stage-arrow left" id="btn-user-char-prev" aria-label="前のキャラ">◀</button>
        <button type="button" class="btn-stage-arrow right" id="btn-user-char-next" aria-label="次のキャラ">▶</button>

        <!-- ステージ中央のキャラクター -->
        <div class="radial-center-character" id="radial-center-character">
          <div class="radial-center-avatar" id="radial-char-icon"></div>
          <span class="radial-center-name" id="radial-char-name">クマさん</span>
        </div>

        <!-- 空状態メッセージ -->
        <div id="empty-stage-msg" class="empty-stage-msg" style="display:none; z-index: 5;">
          <div style="font-size: 2.5rem;">🎈</div>
          <p id="empty-stage-text" style="font-weight:700; color: var(--text-muted);">このキャラ宛ての風船はまだありません</p>
        </div>

      </div>
    </section>

  </main>

  <script src="js/characters.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
