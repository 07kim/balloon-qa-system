<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>インタラクティブ・バルーン Q&A システム</title>
  <meta name="description" content="参加者がキャラクターを選択して質問を風船として飛ばし、みんなでタップして成長・裏返して回答を見る体験型Q&Aプラットフォーム">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- アプリヘッダー -->
  <header class="app-header">
    <a href="#" class="brand-title" id="app-brand-title">
      <span class="logo-icon">🎈</span>
      <span>バルーン Q&A</span>
    </a>
    
    <nav class="tab-nav" aria-label="メインナビゲーション">
      <button type="button" class="tab-btn active" data-tab="submit" id="btn-tab-submit">
        <span>✏️ 質問を送る</span>
      </button>
      <button type="button" class="tab-btn" data-tab="balloons" id="btn-tab-balloons">
        <span>🎈 風船を見る</span>
      </button>
    </nav>

    <a href="admin.html" class="admin-link" id="link-to-admin">iPad 運営管理 ⚙️</a>
  </header>

  <!-- メインコンテンツ -->
  <main class="container">
    
    <!-- ==========================================================================
         タブ1: 質問送信画面 (iPad最適化: 中央1体カルーセル ＋ 吹き出し入力フォーム)
         ========================================================================== -->
    <section id="tab-submit" class="tab-content active">
      <!-- 上部: 中央キャラクターカルーセルステージ -->
      <div class="ipad-stage-header" id="submit-carousel-stage">
        <!-- 左右矢印ボタン -->
        <button type="button" class="btn-stage-arrow left" id="btn-submit-char-prev" aria-label="前のキャラ">◀</button>
        <button type="button" class="btn-stage-arrow right" id="btn-submit-char-next" aria-label="次のキャラ">▶</button>

        <div class="carousel-characters-box">
          <!-- 左の見切れキャラ -->
          <div class="char-slot left-side" id="submit-slot-left">
            <div class="char-slot-icon" id="submit-slot-left-icon"></div>
            <div class="char-slot-name" id="submit-slot-left-name"></div>
          </div>

          <!-- 中央の選択キャラ -->
          <div class="char-slot center" id="submit-slot-center">
            <div class="char-slot-icon" id="submit-slot-center-icon"></div>
            <div class="char-slot-name" id="submit-slot-center-name">名前</div>
          </div>

          <!-- 右の見切れキャラ -->
          <div class="char-slot right-side" id="submit-slot-right">
            <div class="char-slot-icon" id="submit-slot-right-icon"></div>
            <div class="char-slot-name" id="submit-slot-right-name"></div>
          </div>
        </div>
      </div>

      <!-- 下部: 吹き出し型 質問入力フォーム -->
      <div class="speech-bubble-wrapper">
        <div class="speech-bubble-tail"></div>
        <div class="speech-bubble-card" style="min-height: auto; padding: 20px 24px;">
          <div class="form-group" style="margin-bottom: 12px;">
            <label for="question-input" class="form-label" style="font-size: 1rem; color: var(--text-main); font-weight:800;">
              質問内容を入力してください
            </label>
            <textarea 
              id="question-input" 
              class="question-textarea" 
              placeholder="例: 今日の一番のおすすめセッションは何ですか？" 
              maxlength="200"
              rows="3"></textarea>
          </div>

          <button type="button" class="btn-submit" id="submit-btn" style="height: 52px; font-size: 1.1rem;">
            <span>風船を飛ばす 🎈</span>
          </button>

          <div id="form-alert" class="alert-message" role="alert"></div>
        </div>
      </div>
    </section>

    <!-- ==========================================================================
         タブ2: バルーン表示画面 (iPad最適化: 中央キャラ ＋ 放射状浮遊風船)
         ========================================================================== -->
    <section id="tab-balloons" class="tab-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px; flex-wrap:wrap; gap:8px;">
        <div class="filter-group">
          <button type="button" class="btn-filter active" data-balloon-filter="all" id="btn-balloon-filter-all">🌈 すべて</button>
          <button type="button" class="btn-filter" data-balloon-filter="pending" id="btn-balloon-filter-pending">❓ 質問 (未回答)</button>
          <button type="button" class="btn-filter" data-balloon-filter="answered" id="btn-balloon-filter-answered">💡 回答を見る</button>
        </div>

        <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 700;">
          同期中 (<span id="last-sync-time">--:--:--</span>) | 💡 タップで回答表示
        </div>
      </div>

      <!-- 放射状バルーンステージ -->
      <div class="radial-balloon-stage" id="balloon-stage">
        <!-- 左右切り替え矢印ボタン -->
        <button type="button" class="btn-stage-arrow left" id="btn-user-char-prev" aria-label="前のキャラ">◀</button>
        <button type="button" class="btn-stage-arrow right" id="btn-user-char-next" aria-label="次のキャラ">▶</button>

        <!-- ステージ中央のキャラクター -->
        <div class="radial-center-character" id="radial-center-character">
          <div class="radial-center-avatar" id="radial-char-icon"></div>
          <span class="radial-center-name" id="radial-char-name">クマさん</span>
        </div>

        <!-- 空状態メッセージ -->
        <div id="empty-stage-msg" class="empty-stage-msg" style="display:none; z-index: 5;">
          <div style="font-size: 2.5rem;">🎈</div>
          <p id="empty-stage-text" style="font-weight:700; color: var(--text-muted);">このキャラ宛ての風船はまだありません</p>
        </div>
      </div>
    </section>

  </main>

  <script src="js/characters.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
